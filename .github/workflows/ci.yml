name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Report existing lint debt
        continue-on-error: true
        run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Optional: add repo secret GCC_V2_ACCESS_TOKEN (= signed-in gcc_v2_access cookie) for full signed-in e2e.
      - run: npm run test:e2e
        env:
          E2E_ACCESS_TOKEN: ${{ secrets.GCC_V2_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
